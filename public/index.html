<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比賽管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-center">
            <h1 class="text-3xl font-bold text-slate-800">🏆 比賽管理系統</h1>
            <p class="text-slate-500 mt-2">手動發佈與管理各類賽事資訊</p>
        </header>

        <!-- 發佈比賽表單 -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-slate-700 mb-4">發佈新比賽</h2>
            <form id="competitionForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">比賽名稱 <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="name" required
                        class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">比賽地點 <span
                            class="text-slate-400 text-xs">(選填)</span></label>
                    <input type="text" id="location"
                        class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">比賽日期 <span
                            class="text-slate-400 text-xs">(選填)</span></label>
                    <input type="date" id="date"
                        class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">比賽時間 (24小時制) <span
                            class="text-slate-400 text-xs">(選填)</span></label>
                    <!-- 文字輸入框：允許自由打字輸入 24 小時制時間 -->
                    <input type="text" id="time" placeholder="例如 14:30 或 09:05" maxlength="5"
                        class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-600 mb-1">比賽簡介 / 備註 <span
                            class="text-slate-400 text-xs">(選填)</span></label>
                    <textarea id="description" rows="2"
                        class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit"
                        class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">發佈比賽</button>
                </div>
            </form>
        </section>

        <!-- 比賽列表區塊 -->
        <section class="space-y-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <h2 class="text-xl font-bold text-slate-700">比賽列表</h2>

                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="searchInput" placeholder="🔍 搜尋比賽名稱、地點或備註..."
                        class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-64">
                    <input type="date" id="dateFilterInput"
                        class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="resetFilterBtn"
                        class="text-xs bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-300 transition">
                        清除篩選
                    </button>
                </div>
            </div>

            <div id="competitionList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </div>

    <script>
        // 修正重點：改為相對路徑，讓瀏覽器自動指走向你的 Express 後端 API
        const API_URL = '/api/competitions';
        let allCompetitions = [];

        // 1. 從後端抓取所有比賽資料
        async function fetchCompetitions() {
            try {
                const res = await fetch(API_URL);
                allCompetitions = await res.json();
                renderCompetitions(allCompetitions);
            } catch (err) {
                console.error('無法載入比賽列表：', err);
            }
        }

        // 2. 渲染比賽卡片至畫面上
        function renderCompetitions(competitions) {
            const listElement = document.getElementById('competitionList');
            listElement.innerHTML = '';

            if (!Array.isArray(competitions) || competitions.length === 0) {
                listElement.innerHTML = `<p class="text-slate-400 col-span-2 text-center py-4">沒有找到符合條件的比賽資訊。</p>`;
                return;
            }

            competitions.forEach(item => {
                let dateTimeStr = '未提供';
                if (item.date && item.time) {
                    dateTimeStr = `${item.date} ${item.time}`;
                } else if (item.date) {
                    dateTimeStr = item.date;
                } else if (item.time) {
                    dateTimeStr = item.time;
                }

                const locationStr = item.location ? item.location : '未提供';

                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2 relative group';
                card.innerHTML = `
          <div class="flex justify-between items-start">
            <h3 class="text-lg font-bold text-slate-800">${item.name}</h3>
            <button onclick="deleteCompetition(${item.id})" class="text-red-500 hover:text-red-700 text-sm font-medium px-2 py-1 rounded bg-red-50 hover:bg-red-100 transition">
              🗑️ 刪除
            </button>
          </div>
          <p class="text-sm text-slate-600">📅 <b>日期時間：</b>${dateTimeStr}</p>
          <p class="text-sm text-slate-600">📍 <b>地點：</b>${locationStr}</p>
          ${item.description ? `<p class="text-sm text-slate-500 pt-2 border-t border-slate-100">${item.description}</p>` : ''}
        `;
                listElement.appendChild(card);
            });
        }

        // 3. 搜尋與篩選邏輯
        function filterCompetitions() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedDate = document.getElementById('dateFilterInput').value;

            const filtered = allCompetitions.filter(item => {
                const matchesKeyword =
                    item.name.toLowerCase().includes(keyword) ||
                    (item.location && item.location.toLowerCase().includes(keyword)) ||
                    (item.description && item.description.toLowerCase().includes(keyword));

                const matchesDate = !selectedDate || item.date === selectedDate;

                return matchesKeyword && matchesDate;
            });

            renderCompetitions(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterCompetitions);
        document.getElementById('dateFilterInput').addEventListener('change', filterCompetitions);

        document.getElementById('resetFilterBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilterInput').value = '';
            renderCompetitions(allCompetitions);
        });

        // 4. 刪除比賽
        async function deleteCompetition(id) {
            if (!confirm('確定要刪除這筆比賽資訊嗎？')) return;

            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (res.ok) {
                fetchCompetitions();
            } else {
                alert('刪除失敗！');
            }
        }

        // 5. 表單送出事件（包含 24 小時制格式驗證）
        document.getElementById('competitionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const timeVal = document.getElementById('time').value.trim();

            if (timeVal !== '') {
                const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
                if (!timeRegex.test(timeVal)) {
                    alert('請輸入正確的 24 小時制時間格式！例如：14:30 或 09:05');
                    return;
                }
            }

            const payload = {
                name: document.getElementById('name').value,
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                time: timeVal,
                description: document.getElementById('description').value
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('competitionForm').reset();
                fetchCompetitions();
            } else {
                alert('發佈失敗，請檢查欄位！');
            }
        });

        fetchCompetitions();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比賽管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    🏆 比賽管理系統
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">手動發佈與管理各類賽事資訊</p>
            </div>

            <div class="flex items-center gap-3">
                <!-- 權限身份標籤 -->
                <span id="authStatus"
                    class="text-sm font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                    👤 普通訪客 (唯讀)
                </span>

                <!-- 超級管理員專屬功能按鈕 -->
                <button id="adminMgmtBtn" onclick="openAdminModal()"
                    class="hidden text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1">
                    ⚙️ 帳號管理
                </button>

                <!-- 登入/登出按鈕 -->
                <button id="authBtn" onclick="toggleAuth()"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg shadow-sm transition">
                    管理員登入
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. 表單區塊：新增/編輯比賽 (僅限管理員) -->
        <section id="createSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                ➕ 發佈新比賽
            </h2>
            <form id="competitionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽名稱 *</label>
                    <input type="text" id="name" required placeholder="例如：2026 全國羽球公開賽"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽地點 (選填)</label>
                        <input type="text" id="location" placeholder="例如：台北體育館"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽日期 (選填)</label>
                        <input type="date" id="date"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽時間 (24小時制，選填)</label>
                        <input type="text" id="time" placeholder="例如 14:30 或 09:05"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="is_registration_open"
                        class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <label for="is_registration_open" class="text-xs font-semibold text-slate-700 cursor-pointer">開放報名中
                        (勾選後顯示「報名中」標籤)</label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽簡介 / 備註 (選填)</label>
                    <textarea id="description" rows="3" placeholder="請輸入詳細說明或報名連結..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        發佈比賽
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()"
                        class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition">
                        取消編輯
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 比賽列表區塊 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📋 比賽列表
                </h2>

                <!-- 搜尋與篩選列 + 回收桶按鈕 -->
                <div class="flex flex-wrap items-center gap-2">
                    <input type="text" id="searchInput" oninput="filterCompetitions()" placeholder="🔍 搜尋比賽名稱、地點..."
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="date" id="filterDateInput" onchange="filterCompetitions()"
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="clearFilter()"
                        class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1 bg-slate-100 rounded border">清除篩選</button>

                    <!-- 📍 移至此處的資源回收桶按鈕 (僅超級管理員可見) -->
                    <button id="mainTrashBtn" onclick="openTrashModal()"
                        class="hidden text-xs bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1 shadow-sm">
                        🗑️ 資源回收桶
                    </button>
                </div>
            </div>

            <!-- 動態渲染卡片清單 -->
            <div id="competitionList" class="space-y-4">
                <p class="text-center text-slate-400 py-8">載入中...</p>
            </div>
        </section>

    </main>

    <!-- 彈出視窗 1：登入 Modal -->
    <div id="loginModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">管理員登入</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">帳號</label>
                    <input type="text" id="loginUsername"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                    <input type="password" id="loginPassword"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeLoginModal()"
                    class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="performLogin()"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">登入</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 2：帳號管理 Modal (超級管理員專屬) -->
    <div id="adminModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">⚙️ 管理員帳號維護</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <!-- 新增管理員 -->
            <form onsubmit="handleAddAdmin(event)" class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <h4 class="text-xs font-bold text-slate-700 uppercase">新增管理員帳號</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="newAdminUser" placeholder="帳號" required
                        class="px-3 py-1.5 border rounded text-sm">
                    <input type="password" id="newAdminPass" placeholder="密碼" required
                        class="px-3 py-1.5 border rounded text-sm">
                </div>
                <div class="flex justify-between items-center pt-1">
                    <select id="newAdminRole" class="px-2 py-1.5 border rounded text-xs">
                        <option value="admin">一般管理員 (admin)</option>
                        <option value="super_admin">超級管理員 (super_admin)</option>
                    </select>
                    <button type="submit"
                        class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded hover:bg-emerald-700">新增</button>
                </div>
            </form>

            <!-- 帳號清單 -->
            <div>
                <h4 class="text-xs font-bold text-slate-700 uppercase mb-2">現有帳號列表</h4>
                <div id="adminList" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- 動態載入帳號 -->
                </div>
            </div>

            <div class="flex justify-end pt-2 border-t">
                <button onclick="closeAdminModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 3：資源回收桶 Modal -->
    <div id="trashModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🗑️ 資源回收桶 (已刪除賽事)
                </h3>
                <button onclick="closeTrashModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div id="trashList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- 動態渲染刪除列表 -->
            </div>

            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeTrashModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let allCompetitions = [];
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('competition_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            }
            updateUIByRole();
            fetchCompetitions();
        });

        // 依權限更新 UI 介面
        function updateUIByRole() {
            const authStatus = document.getElementById('authStatus');
            const authBtn = document.getElementById('authBtn');
            const createSection = document.getElementById('createSection');
            const adminMgmtBtn = document.getElementById('adminMgmtBtn');
            const mainTrashBtn = document.getElementById('mainTrashBtn');

            if (!currentUser) {
                authStatus.className = "text-sm font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200";
                authStatus.innerText = "👤 普通訪客 (唯讀)";
                authBtn.innerText = "管理員登入";
                authBtn.className = "bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg shadow-sm transition";
                createSection.classList.add('hidden');
                adminMgmtBtn.classList.add('hidden');
                if (mainTrashBtn) mainTrashBtn.classList.add('hidden');
            } else {
                authBtn.innerText = "登出";
                authBtn.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-4 py-1.5 rounded-lg transition";
                createSection.classList.remove('hidden');

                if (currentUser.role === 'super_admin') {
                    authStatus.className = "text-sm font-medium px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 border border-indigo-300";
                    authStatus.innerText = `👑 超級管理員: ${currentUser.username}`;
                    adminMgmtBtn.classList.remove('hidden');
                    if (mainTrashBtn) mainTrashBtn.classList.remove('hidden');
                } else {
                    authStatus.className = "text-sm font-medium px-3 py-1 rounded-full bg-blue-100 text-blue-700 border border-blue-300";
                    authStatus.innerText = `🛡️ 管理員: ${currentUser.username}`;
                    adminMgmtBtn.classList.add('hidden');
                    if (mainTrashBtn) mainTrashBtn.classList.add('hidden');
                }
            }
            renderCompetitions(allCompetitions);
        }

        // API：抓取公開比賽
        async function fetchCompetitions() {
            try {
                const res = await fetch('/api/competitions');
                allCompetitions = await res.json();
                renderCompetitions(allCompetitions);
            } catch (err) {
                console.error(err);
                document.getElementById('competitionList').innerHTML = `<p class="text-red-500 text-center py-4">無法載入比賽資料</p>`;
            }
        }

        // 渲染比賽列表
        function renderCompetitions(data) {
            const listEl = document.getElementById('competitionList');
            if (!data || data.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-8">目前無符合條件的比賽資料</p>`;
                return;
            }

            listEl.innerHTML = data.map(item => `
                <div class="border border-slate-200 rounded-xl p-5 hover:border-slate-300 transition bg-white shadow-sm flex flex-col md:flex-row justify-between gap-4">
                    <div class="space-y-2 flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h3 class="text-base font-bold text-slate-800">${escapeHtml(item.name)}</h3>
                            ${item.is_registration_open ? '<span class="bg-red-100 text-red-600 text-xs px-2 py-0.5 rounded-full font-medium">🔥 報名中</span>' : ''}
                            ${getBadgeStatus(item.date)}
                        </div>
                        
                        <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
                            ${item.location ? `<span>📍 ${escapeHtml(item.location)}</span>` : ''}
                            ${item.date ? `<span>📅 ${escapeHtml(item.date)}</span>` : ''}
                            ${item.time ? `<span>⏰ ${escapeHtml(item.time)}</span>` : ''}
                        </div>

                        ${item.description ? `<p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg whitespace-pre-line border border-slate-100">${escapeHtml(item.description)}</p>` : ''}
                    </div>

                    <div class="flex items-start gap-1.5 self-end md:self-start">
                        <!-- 1. 所有人（含普通訪客）都能使用的：一鍵複製文字至剪貼簿 -->
                        <button onclick="copyToClipboard('${escapeHtml(item.name)}', '${item.date}', '${escapeHtml(item.location)}')" 
                                class="text-xs text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded transition">
                            📋 複製分享
                        </button>

                        <!-- 2. 僅管理員可見的操作按鈕 -->
                        ${currentUser ? `
                            <button onclick="copyCompetition(${item.id})" class="text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded transition">複製發佈</button>
                            <button onclick="startEdit(${item.id})" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded transition">編輯</button>
                            <button onclick="deleteCompetition(${item.id})" class="text-xs text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded transition">刪除</button>
                        ` : ''}
                    </div>

                </div>
            `).join('');
        }

        // 表單提交（新增或編輯）
        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!currentUser) return alert('請先登入');

            const editingId = document.getElementById('editingId').value;
            const payload = {
                name: document.getElementById('name').value,
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value,
                is_registration_open: document.getElementById('is_registration_open').checked
            };

            const url = editingId ? `/api/competitions/${editingId}` : '/api/competitions';
            const method = editingId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': currentUser.id
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error || '儲存失敗');
                }

                resetForm();
                fetchCompetitions();
            } catch (err) {
                alert(err.message);
            }
        }

        function startEdit(id) {
            const item = allCompetitions.find(c => c.id === id);
            if (!item) return;

            document.getElementById('editingId').value = item.id;
            document.getElementById('name').value = item.name || '';
            document.getElementById('location').value = item.location || '';
            document.getElementById('date').value = item.date || '';
            document.getElementById('time').value = item.time || '';
            document.getElementById('description').value = item.description || '';
            document.getElementById('is_registration_open').checked = !!item.is_registration_open;

            document.getElementById('formTitle').innerText = '✏️ 編輯比賽資料';
            document.getElementById('submitBtn').innerText = '儲存變更';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyCompetition(id) {
            const item = allCompetitions.find(c => c.id === id);
            if (!item) return;

            document.getElementById('editingId').value = '';
            document.getElementById('name').value = `${item.name} (複製)`;
            document.getElementById('location').value = item.location || '';
            document.getElementById('date').value = item.date || '';
            document.getElementById('time').value = item.time || '';
            document.getElementById('description').value = item.description || '';
            document.getElementById('is_registration_open').checked = !!item.is_registration_open;

            document.getElementById('formTitle').innerText = '➕ 發佈新比賽 (複製內容)';
            document.getElementById('submitBtn').innerText = '發佈比賽';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyToClipboard(name, date, location) {
            const textToCopy = `🏆 【${name}】\n📅 日期：${date || '未定'}\n📍 地點：${location || '未定'}\n\n👉 歡迎關注與報名！`;

            navigator.clipboard.writeText(textToCopy)
                .then(() => alert('✅ 比賽資訊已成功複製到剪貼簿！'))
                .catch(err => {
                    console.error('複製失敗:', err);
                    alert('❌ 複製失敗，請手動複製。');
                });
        }

        function resetForm() {
            document.getElementById('competitionForm').reset();
            document.getElementById('editingId').value = '';
            document.getElementById('formTitle').innerText = '➕ 發佈新比賽';
            document.getElementById('submitBtn').innerText = '發佈比賽';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteCompetition(id) {
            if (!confirm('確定要刪除這筆比賽嗎？(資料將移至資源回收桶)')) return;

            try {
                const res = await fetch(`/api/competitions/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-user-id': currentUser.id }
                });

                if (!res.ok) throw new Error('刪除失敗');
                fetchCompetitions();
            } catch (err) {
                alert(err.message);
            }
        }

        // 登入相關邏輯
        function toggleAuth() {
            if (currentUser) {
                currentUser = null;
                localStorage.removeItem('competition_user');
                updateUIByRole();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        async function performLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '登入失敗');

                currentUser = data.user;
                localStorage.setItem('competition_user', JSON.stringify(currentUser));
                closeLoginModal();
                updateUIByRole();
            } catch (err) {
                alert(err.message);
            }
        }

        // 帳號管理視窗邏輯
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            fetchAdminList();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        async function fetchAdminList() {
            try {
                const res = await fetch('/api/admins', {
                    headers: { 'x-user-id': currentUser.id }
                });
                const admins = await res.json();

                const listEl = document.getElementById('adminList');
                listEl.innerHTML = admins.map(a => `
                    <div class="flex justify-between items-center bg-slate-100 p-2.5 rounded text-xs border">
                        <div>
                            <span class="font-bold text-slate-800">${escapeHtml(a.username)}</span>
                            <span class="text-slate-400 ml-1">(${a.role})</span>
                        </div>
                        ${a.id !== currentUser.id ? `
                            <button onclick="deleteAdmin('${a.id}')" class="text-red-500 hover:text-red-700">刪除</button>
                        ` : '<span class="text-slate-400">目前帳號</span>'}
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function handleAddAdmin(e) {
            e.preventDefault();
            const username = document.getElementById('newAdminUser').value;
            const password = document.getElementById('newAdminPass').value;
            const role = document.getElementById('newAdminRole').value;

            try {
                const res = await fetch('/api/admins', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': currentUser.id
                    },
                    body: JSON.stringify({ username, password, role })
                });

                if (!res.ok) throw new Error('新增管理員失敗');

                document.getElementById('newAdminUser').value = '';
                document.getElementById('newAdminPass').value = '';
                document.getElementById('newAdminRole').value = 'admin';
                fetchAdminList();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteAdmin(id) {
            if (!confirm('確定要刪除此管理員？')) return;
            try {
                const res = await fetch(`/api/admins/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-user-id': currentUser.id }
                });
                if (!res.ok) throw new Error('刪除失敗');
                fetchAdminList();
            } catch (err) {
                alert(err.message);
            }
        }

        // 回收桶視窗邏輯
        async function openTrashModal() {
            document.getElementById('trashModal').classList.remove('hidden');
            fetchTrashList();
        }

        function closeTrashModal() {
            document.getElementById('trashModal').classList.add('hidden');
        }

        async function fetchTrashList() {
            const listEl = document.getElementById('trashList');
            listEl.innerHTML = '<p class="text-center text-slate-400 py-4">載入中...</p>';

            try {
                const res = await fetch('/api/competitions/deleted', {
                    headers: { 'x-user-id': currentUser.id }
                });
                const deletedItems = await res.json();

                if (!deletedItems || deletedItems.length === 0) {
                    listEl.innerHTML = `<p class="text-center text-slate-400 py-6">回收桶是空的</p>`;
                    return;
                }

                listEl.innerHTML = deletedItems.map(item => `
                    <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-slate-800">${escapeHtml(item.name)}</p>
                            <p class="text-slate-400 mt-0.5">地點: ${escapeHtml(item.location || '未填')} | 日期: ${item.date || '未填'}</p>
                        </div>
                        <button onclick="restoreCompetition(${item.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded transition">
                            🔄 復原
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<p class="text-red-500 text-center py-4">無法取得已刪除項目</p>`;
            }
        }

        async function restoreCompetition(id) {
            try {
                const res = await fetch(`/api/competitions/${id}/restore`, {
                    method: 'PUT',
                    headers: { 'x-user-id': currentUser.id }
                });

                if (!res.ok) throw new Error('復原失敗');

                fetchTrashList();
                fetchCompetitions();
            } catch (err) {
                alert(err.message);
            }
        }

        // 搜尋與篩選
        function filterCompetitions() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const dateVal = document.getElementById('filterDateInput').value;

            const filtered = allCompetitions.filter(item => {
                const matchesSearch = (item.name && item.name.toLowerCase().includes(searchVal)) ||
                    (item.location && item.location.toLowerCase().includes(searchVal)) ||
                    (item.description && item.description.toLowerCase().includes(searchVal));

                const matchesDate = !dateVal || item.date === dateVal;

                return matchesSearch && matchesDate;
            });

            renderCompetitions(filtered);
        }

        function clearFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDateInput').value = '';
            renderCompetitions(allCompetitions);
        }

        // 輔助函式
        function getBadgeStatus(dateStr) {
            if (!dateStr) return '';
            const today = new Date().toISOString().split('T')[0];
            if (dateStr > today) return '<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-medium">即將開賽</span>';
            if (dateStr === today) return '<span class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-medium">今日開賽</span>';
            return '<span class="bg-slate-100 text-slate-500 text-xs px-2 py-0.5 rounded-full">已結束</span>';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比賽管理系統 v2.3.5</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    🏆 比賽管理系統
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">手動發佈與管理各類賽事資訊 (v2.3.5)</p>
            </div>

            <div class="flex items-center gap-3">
                <!-- 權限身份標籤 -->
                <span id="authStatus"
                    class="text-sm font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                    👤 普通訪客
                </span>

                <!-- 手動 Bug 回報按鈕 (所有人皆可用) -->
                <button onclick="openBugReportModal()"
                    class="text-sm bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200 transition flex items-center gap-1 font-medium">
                    🐞 回報問題
                </button>

                <!-- 超級管理員專屬功能按鈕：操作日誌 -->
                <button id="auditLogBtn" onclick="openAuditLogModal()"
                    class="hidden text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1">
                    📜 操作日誌
                </button>

                <!-- 超級管理員專屬功能按鈕：錯誤日誌 -->
                <button id="btn-error-logs" onclick="openErrorLogsModal()"
                    class="hidden px-3 py-1.5 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm font-medium hover:bg-red-100 flex items-center gap-1 transition">
                    🚨 錯誤日誌
                </button>

                <!-- 超級管理員專屬功能按鈕：帳號管理 -->
                <button id="adminMgmtBtn" onclick="openAdminModal()"
                    class="hidden text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1">
                    ⚙️ 帳號管理
                </button>

                <!-- 登入/登出按鈕 -->
                <button id="authBtn" onclick="toggleAuth()"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg shadow-sm transition">
                    登入
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. 表單區塊：新增/編輯比賽 (僅限管理員) -->
        <section id="createSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                ➕ 發佈新比賽
            </h2>
            <form id="competitionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽名稱 *</label>
                    <input type="text" id="name" required placeholder="例如：2026 全國羽球公開賽"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽地點 (選填)</label>
                    <input type="text" id="location" placeholder="例如：XX體育館"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 日期與 24 小時制時間選擇器 (強制下拉選單) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽開始日期 / 時間 (24小時制)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" id="date"
                                class="w-full md:col-span-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div class="md:col-span-2 flex items-center gap-1">
                                <select id="start_hour"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">時</option>
                                </select>
                                <span class="font-bold text-slate-400">:</span>
                                <select id="start_minute"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">分</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽結束日期 / 時間 (24小時制)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" id="end_date"
                                class="w-full md:col-span-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div class="md:col-span-2 flex items-center gap-1">
                                <select id="end_hour"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">時</option>
                                </select>
                                <span class="font-bold text-slate-400">:</span>
                                <select id="end_minute"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">分</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="is_registration_open"
                        class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <label for="is_registration_open" class="text-xs font-semibold text-slate-700 cursor-pointer">開放報名中
                        (勾選後顯示「報名中」標籤)</label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽簡介 / 備註 (選填)</label>
                    <textarea id="description" rows="3" placeholder="請輸入詳細說明或報名連結..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        發佈比賽
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()"
                        class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition">
                        取消編輯
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 比賽列表區塊 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📋 比賽列表
                </h2>

                <!-- 搜尋與篩選列 + 回收桶按鈕 -->
                <div class="flex flex-wrap items-center gap-2">
                    <input type="text" id="searchInput" oninput="filterCompetitions()" placeholder="🔍 搜尋比賽名稱、地點..."
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="date" id="filterDateInput" onchange="filterCompetitions()"
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="clearFilter()"
                        class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1 bg-slate-100 rounded border">清除篩選</button>

                    <!-- 資源回收桶按鈕 (管理員與超級管理員可見) -->
                    <button id="mainTrashBtn" onclick="openTrashModal()"
                        class="hidden text-xs bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1 shadow-sm">
                        🗑️ 資源回收桶
                    </button>
                </div>
            </div>

            <!-- 動態渲染卡片清單 -->
            <div id="competitionList" class="space-y-4">
                <p class="text-center text-slate-400 py-8">載入中...</p>
            </div>
        </section>

    </main>

    <!-- 彈出視窗：手動回報 Bug Modal -->
    <div id="bugReportModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🐞 回報系統問題 (Bug Report)
                </h3>
                <button onclick="closeBugReportModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form id="bugReportForm" onsubmit="submitBugReport(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題類型 *</label>
                    <select id="bugType" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="user_reported_bug">🐛 介面/功能異常 (Bug)</option>
                        <option value="time_format_error">⏰ 時間格式問題</option>
                        <option value="ui_display_issue">🎨 版面顯示錯亂</option>
                        <option value="other">💬 其他建議或問題</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題詳細描述 *</label>
                    <textarea id="bugDescription" rows="4" required
                        placeholder="請詳細說明你在什麼步驟遇到了問題、預期結果與實際發生的狀況...如：iPhone 18 Pro Max，iOS 27.0，Safari 瀏覽器，點擊「」後，頁面無法跳轉且出現空白，Error code: XXX，或：我希望能增加一個功能，讓我可以...，請讓我成為管理員...等"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題截圖 (選填，支援 PNG/JPG，上限 10MB)</label>
                    <input type="file" id="bugScreenshot" accept="image/*" onchange="previewScreenshot(event)"
                        class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="screenshotPreviewContainer" class="mt-2 hidden">
                        <img id="screenshotPreview" src="" alt="預覽圖"
                            class="max-h-40 rounded border border-slate-200 object-contain">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">聯絡方式 (選填，請標記類型如：電話號碼)</label>
                    <input type="text" id="reporterContact" placeholder="方便我們向你回報修復進度"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeBugReportModal()"
                        class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit"
                        class="px-4 py-2 text-sm bg-amber-600 text-white rounded-lg hover:bg-amber-700 font-medium transition">送出回報</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈出視窗 1：登入 Modal -->
    <div id="loginModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">登入</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">帳號</label>
                    <input type="text" id="loginUsername" placeholder="account"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                    <input type="password" id="loginPassword" placeholder="password"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeLoginModal()"
                    class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="performLogin()"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">登入</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 2：系統操作日誌 Modal (超級管理員專屬) -->
    <div id="auditLogModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📜 系統操作日誌 (Audit Logs)
                </h3>
                <button onclick="closeAuditLogModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="auditLogList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs"></div>
            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeAuditLogModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 3：系統錯誤日誌 Modal (超級管理員專屬) -->
    <div id="errorLogsModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-red-600 flex items-center gap-2">
                    🚨 系統異常錯誤日誌 (Error Logs)
                </h3>
                <button onclick="closeErrorLogsModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="errorLogList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs font-mono"></div>
            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeErrorLogsModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 4：帳號管理 Modal (超級管理員專屬) -->
    <div id="adminModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">⚙️ 管理員帳號維護</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <!-- 新增管理員 -->
            <form onsubmit="handleAddAdmin(event)" class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <h4 class="text-xs font-bold text-slate-700 uppercase">新增管理員帳號</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="newAdminUser" placeholder="帳號" required
                        class="px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <input type="password" id="newAdminPass" placeholder="密碼" required
                        class="px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="flex justify-between items-center pt-1">
                    <select id="newAdminRole"
                        class="px-2 py-1.5 border border-slate-300 rounded text-xs focus:outline-none">
                        <option value="admin">一般管理員 (admin)</option>
                        <option value="super_admin">超級管理員 (super_admin)</option>
                    </select>
                    <button type="submit"
                        class="bg-emerald-600 text-white text-xs font-medium px-3 py-1.5 rounded hover:bg-emerald-700 transition">新增帳號</button>
                </div>
            </form>

            <!-- 帳號清單 -->
            <div>
                <h4 class="text-xs font-bold text-slate-700 uppercase mb-2">現有帳號列表</h4>
                <div id="adminList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>

            <div class="flex justify-end pt-2 border-t">
                <button onclick="closeAdminModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 5：資源回收桶 Modal -->
    <div id="trashModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🗑️ 資源回收桶 (已刪除賽事)
                </h3>
                <button onclick="closeTrashModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div id="trashList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>

            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeTrashModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let allCompetitions = [];
        let currentUser = null;
        let currentBase64Screenshot = '';

        // 1. 動態控制新增帳號時的角色下拉選單
        function renderRoleSelectOptions() {
            const selectEl = document.getElementById('newAdminRole');
            if (!selectEl) return;

            if (currentUser?.role === 'web_owner') {
                selectEl.innerHTML = `
                    <option value="admin">一般管理員 (admin)</option>
                    <option value="super_admin">超級管理員 (super_admin)</option>
                `;
            } else {
                // super_admin 只能新增普通 admin
                selectEl.innerHTML = `
                    <option value="admin">一般管理員 (admin)</option>
                `;
            }
        }

        // 2. 帳號清單渲染防呆邏輯
        function getRoleBadge(role) {
            if (role === 'web_owner') return '<span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold">🧑🏻‍💼 Web Owner</span>';
            if (role === 'super_admin') return '<span class="bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded font-medium">🧑‍💼 超級管理員</span>';
            return '<span class="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded">👤 一般管理員</span>';
        }

        // 判定是否可顯示「刪除」按鈕
        function canDeleteAdmin(targetAdmin) {
            if (!currentUser) return false;
            if (targetAdmin.username === currentUser.username) return false; // 排除自己
            if (targetAdmin.role === 'web_owner') return false; // Web Owner 不可被刪

            if (currentUser.role === 'web_owner') return true;
            if (currentUser.role === 'super_admin') {
                // super_admin 只能刪除普通 admin
                return targetAdmin.role === 'admin';
            }
            return false;
        }

        // v2.3.4 Helper: 解析 User-Agent 顯示裝置標籤
        function parseUserAgentBadge(ua) {
            if (!ua) return '<span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded">💻 未知裝置</span>';
            if (ua.includes('iPhone')) return '<span class="bg-purple-100 text-purple-700 text-[10px] px-1.5 py-0.5 rounded font-medium">📱 iPhone</span>';
            if (ua.includes('iPad')) return '<span class="bg-indigo-100 text-indigo-700 text-[10px] px-1.5 py-0.5 rounded font-medium">📱 iPad</span>';
            if (ua.includes('Macintosh') || ua.includes('Mac OS')) return '<span class="bg-slate-200 text-slate-700 text-[10px] px-1.5 py-0.5 rounded font-medium">💻 macOS</span>';
            if (ua.includes('Windows')) return '<span class="bg-blue-100 text-blue-700 text-[10px] px-1.5 py-0.5 rounded font-medium">💻 Windows</span>';
            if (ua.includes('Android')) return '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.5 rounded font-medium">🤖 Android</span>';
            return '<span class="bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded">🌐 Browser</span>';
        }

        // 初始化 24 小時制時間下拉選單 (00-23 時與 00-59 分)
        function initTimeSelects() {
            const hourOptions = '<option value="">時</option>' + Array.from({ length: 24 }, (_, i) => {
                const val = String(i).padStart(2, '0');
                return `<option value="${val}">${val} 時</option>`;
            }).join('');

            const minuteOptions = '<option value="">分</option>' + Array.from({ length: 60 }, (_, i) => {
                const val = String(i).padStart(2, '0');
                return `<option value="${val}">${val} 分</option>`;
            }).join('');

            document.getElementById('start_hour').innerHTML = hourOptions;
            document.getElementById('end_hour').innerHTML = hourOptions;
            document.getElementById('start_minute').innerHTML = minuteOptions;
            document.getElementById('end_minute').innerHTML = minuteOptions;
        }

        // 從下拉選單組合時間字串 (HH:mm)
        function getSelectedTime(hourId, minuteId) {
            const h = document.getElementById(hourId).value;
            const m = document.getElementById(minuteId).value;
            if (!h && !m) return '';
            return `${h || '00'}:${m || '00'}`;
        }

        // 設定下拉選單的值
        function setSelectedTime(timeStr, hourId, minuteId) {
            if (!timeStr) {
                document.getElementById(hourId).value = '';
                document.getElementById(minuteId).value = '';
                return;
            }
            const parts = timeStr.split(':');
            if (parts.length >= 2) {
                document.getElementById(hourId).value = parts[0].padStart(2, '0');
                document.getElementById(minuteId).value = parts[1].padStart(2, '0');
            }
        }

        // 格式化時間為 24 小時制 (HH:mm) 供清單渲染使用
        function format24HourTime(timeStr) {
            if (!timeStr) return '';
            const parts = timeStr.split(':');
            if (parts.length < 2) return timeStr;
            const hours = parts[0].padStart(2, '0');
            const minutes = parts[1].padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function previewScreenshot(event) {

            if (!file) {
                currentBase64Screenshot = '';
                document.getElementById('screenshotPreviewContainer').classList.add('hidden');
                document.getElementById('screenshotPreview').src = '';
                return;
            }

            if (!file.type.startsWith('image/')) {
                alert('請選擇有效的圖片檔案 (PNG, JPG 等)');
                event.target.value = '';
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('截圖檔案過大，請選擇 10MB 以下的圖片');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                currentBase64Screenshot = e.target.result;
                const img = document.getElementById('screenshotPreview');
                img.src = currentBase64Screenshot;
                document.getElementById('screenshotPreviewContainer').classList.remove('hidden');

            reader.onerror = function () {
                alert('讀取圖片檔案失敗，請重新嘗試');
                event.target.value = '';
                currentBase64Screenshot = '';
                document.getElementById('screenshotPreviewContainer').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // 1. 自動錯誤上報 Helper 函式
        // ==========================================
        async function reportErrorToBackend(errorData) {
            try {
                const userId = currentUser?.id || currentUser?.username || null;
                const headers = { 'Content-Type': 'application/json' };
                if (userId) headers['x-user-id'] = userId;

                await fetch('/api/logs/error', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        error_type: errorData.type || 'frontend_error',
                        message: errorData.message || 'Unknown Error',
                        stack_trace: errorData.stack || '',
                        path: window.location.pathname + window.location.search
                    })
                });
            } catch (err) {
                console.warn('[Error Reporter Failed]:', err);
            }
        }

        window.addEventListener('error', (event) => {
            if (event.target && (event.target.tagName === 'IMG' || event.target.tagName === 'SCRIPT')) return;
            reportErrorToBackend({
                type: 'frontend_js_error',
                message: event.message || 'Script Error',
                stack: event.error ? event.error.stack : `File: ${event.filename}:${event.lineno}:${event.colno}`
            });
        });

        window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            reportErrorToBackend({
                type: 'frontend_promise_rejection',
                message: reason instanceof Error ? reason.message : String(reason),
                stack: reason instanceof Error ? reason.stack : ''
            });
        });

        async function customFetch(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const clonedRes = response.clone();
                    let errorText = '';
                    try {
                        const errJson = await clonedRes.json();
                        errorText = errJson.message || errJson.error || response.statusText;
                    } catch (e) {
                        errorText = await clonedRes.text();
                    }
                    reportErrorToBackend({
                        type: 'api_failure',
                        message: `HTTP ${response.status} - ${errorText}`,
                        stack: `Endpoint: ${url} | Method: ${options.method || 'GET'}`
                    });
                }
                return response;
            } catch (networkError) {
                reportErrorToBackend({
                    type: 'network_failure',
                    message: networkError.message || 'Network Error',
                    stack: `Endpoint: ${url}`
                });
                throw networkError;
            }
        }

            listEl.innerHTML = '<p class="text-center text-slate-400 py-4">載入錯誤日誌中...</p>';

                    }
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || '無法讀取錯誤日誌');

                const logs = result.logs || [];
                if (logs.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-emerald-600 py-4 font-sans font-medium">🎉 目前沒有任何異常錯誤紀錄！</p>';
                    return;
                }

                listEl.innerHTML = logs.map(l => {
                    const hasScreenshot = l.screenshot && typeof l.screenshot === 'string' && l.screenshot.startsWith('data:image/');
                    return `
                    <div class="p-3 bg-red-50 border border-red-200 rounded-lg space-y-1">
                        <div class="flex justify-between items-center flex-wrap gap-1">
                            <div class="flex items-center gap-1.5">
                                <span class="bg-red-200 text-red-800 text-[10px] px-2 py-0.5 rounded font-bold">${escapeHtml(l.error_type)}</span>
                                ${parseUserAgentBadge(l.user_agent)}
                            </div>
                            <span class="text-slate-400 text-[10px]">${new Date(l.created_at).toLocaleString()}</span>
                        </div>
                        <p class="text-red-700 font-semibold text-xs">${escapeHtml(l.message)}</p>
                        ${l.path ? `<p class="text-slate-500 text-[11px]">路徑: ${escapeHtml(l.path)}</p>` : ''}
                        ${l.user_agent ? `<p class="text-[10px] font-mono text-slate-500 bg-white/60 p-1 rounded border border-red-100 break-all">UA: ${escapeHtml(l.user_agent)}</p>` : ''}
                        ${l.stack_trace ? `<pre class="text-[10px] text-slate-600 bg-white p-2 rounded border border-slate-200 overflow-x-auto mt-1">${escapeHtml(l.stack_trace)}</pre>` : ''}
                        
                        <!-- 顯示用戶回報上傳的截圖 -->
                        ${hasScreenshot ? `
                            <div class="mt-2 pt-2 border-t border-red-200">
                                <span class="text-[11px] font-semibold text-slate-600 block mb-1">📷 夾帶截圖：</span>
                                <a href="${l.screenshot}" target="_blank" rel="noopener noreferrer" title="點擊檢視原圖">
                                    <img src="${l.screenshot}" alt="錯誤截圖" class="max-h-48 rounded border border-slate-300 hover:opacity-90 transition object-contain bg-slate-900/5 p-1">
                                </a>
                            </div>
                        ` : ''}
                    </div>
                `}).join('');
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<p class="text-red-500 text-center py-4">載入失敗: ${escapeHtml(err.message)}</p>`;
            }
        }

        function closeErrorLogsModal() {
            document.getElementById('errorLogsModal').classList.add('hidden');
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            renderRoleSelectOptions();
            fetchAdminList();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        async function fetchAdminList() {
            const listEl = document.getElementById('adminList');
            listEl.innerHTML = '<p class="text-center text-slate-400 text-xs py-2">載入帳號清單...</p>';

            try {
                const res = await customFetch('/api/admins', {
                    headers: { 'x-user-id': currentUser.username || currentUser.id }
                });

                if (!res.ok) throw new Error('無法取得管理員清單');
                const admins = await res.json();

                if (!admins || admins.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-slate-400 text-xs py-2">目前沒有其他管理員帳號</p>';
                    return;
                }

                listEl.innerHTML = admins.map(a => {
                    const targetId = a.id || a._id;
                    const canDelete = canDeleteAdmin(a);

                    return `
                        <div class="flex justify-between items-center bg-slate-100 p-2.5 rounded text-xs border border-slate-200">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800">${escapeHtml(a.username)}</span>
                                ${getRoleBadge(a.role)}
                            </div>
                            ${canDelete ? `
                                <button onclick="deleteAdmin('${targetId || a.username}')" 
                                    class="text-red-600 hover:text-red-800 font-medium px-2 py-0.5 rounded bg-red-50 hover:bg-red-100 transition">
                                    刪除
                                </button>
                            ` : '<span class="text-slate-400 font-medium px-2 py-0.5">無法操作</span>'}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<p class="text-red-500 text-center text-xs py-2">${err.message}</p>`;
            }
        }

        async function handleAddAdmin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('newAdminUser');
            const passwordInput = document.getElementById('newAdminPass');
            const roleSelect = document.getElementById('newAdminRole');

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const role = roleSelect.value;

            if (!username || !password) {
                alert('請完整填寫帳號與密碼');
                return;
            }

            try {
                const res = await customFetch('/api/admins', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': currentUser.username || currentUser.id
                    },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '新增管理員失敗');

                alert(`✅ 成功新增管理員：${username}`);
                usernameInput.value = '';
                passwordInput.value = '';
                renderRoleSelectOptions();
                fetchAdminList();
            } catch (err) {
                alert('新增失敗：' + err.message);
            }
        }

        async function deleteAdmin(idOrUsername) {
            if (!confirm(`確定要刪除帳號 [${idOrUsername}] 嗎？`)) return;

            try {
                const res = await customFetch(`/api/admins/${idOrUsername}`, {
                    method: 'DELETE',
                    headers: { 'x-user-id': currentUser.username || currentUser.id }
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '刪除失敗');

                alert('✅ 帳號已成功刪除');
                fetchAdminList();
            } catch (err) {
                alert('刪除失敗：' + err.message);
            }
        }

        function openTrashModal() {
            document.getElementById('trashModal').classList.remove('hidden');
            fetchTrashList();
        }

        function closeTrashModal() {
            document.getElementById('trashModal').classList.add('hidden');
        }

        async function fetchTrashList() {
            const listEl = document.getElementById('trashList');
            listEl.innerHTML = '<p class="text-center text-slate-400 py-4">載入中...</p>';

            try {
                const res = await customFetch('/api/competitions/deleted', {
                    headers: {
                        'x-user-id': currentUser.username || currentUser.id,
                        'x-user-role': currentUser?.role || ''
                    }
                });
                const deletedItems = await res.json();

                if (!deletedItems || deletedItems.length === 0) {
                    listEl.innerHTML = `<p class="text-center text-slate-400 py-6">回收桶是空的</p>`;
                    return;
                }

                const isSuperAdmin = currentUser?.role === 'super_admin' || currentUser?.role === 'web_owner';

                listEl.innerHTML = deletedItems.map(item => `
                    <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-slate-800">${escapeHtml(item.name)}</p>
                            <p class="text-slate-400 mt-0.5">地點: ${escapeHtml(item.location || '未填')} | 日期: ${item.date || '未填'}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="restoreCompetition(${item.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded transition">
                                🔄 復原
                            </button>

                            ${isSuperAdmin ? `
                                <button onclick="hardDeleteCompetition(${item.id}, '${escapeHtml(item.name)}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1.5 rounded transition">
                                    ⚠️ 永久刪除
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<p class="text-red-500 text-center py-4">無法載入回收桶資料</p>`;
            }
        }

        async function restoreCompetition(id) {
            try {
                const res = await customFetch(`/api/competitions/${id}/restore`, {
                    method: 'PUT',
                    headers: {
                        'x-user-id': currentUser.username || currentUser.id,
                        'x-user-role': currentUser?.role || ''
                    }
                });

                if (!res.ok) throw new Error('復原失敗');

                fetchTrashList();
                fetchCompetitions();
            } catch (err) {
                alert(err.message);
            }
        }

        async function hardDeleteCompetition(id, name) {
            if (!confirm(`⚠️ 警告：此操作不可逆！\n您確定要永久刪除「${name}」嗎？資料庫將無法復原此項目。`)) return;

            try {
                const res = await customFetch(`/api/competitions/${id}/hard-delete`, {
                    method: 'DELETE',
                    headers: {
                        'x-user-id': currentUser.username || currentUser.id,
                        'x-user-role': currentUser?.role || ''
                    }
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '永久刪除失敗');

                alert('✅ 項目已永久刪除！');
                fetchTrashList();
                fetchCompetitions();
            } catch (err) {
                alert('永久刪除失敗：' + err.message);
            }
        }

        function filterCompetitions() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const dateVal = document.getElementById('filterDateInput').value;

            const filtered = allCompetitions.filter(item => {
                const matchesSearch = (item.name && item.name.toLowerCase().includes(searchVal)) ||
                    (item.location && item.location.toLowerCase().includes(searchVal)) ||
                    (item.description && item.description.toLowerCase().includes(searchVal));

                const matchesDate = !dateVal || item.date === dateVal || item.end_date === dateVal;

                return matchesSearch && matchesDate;
            });

            renderCompetitions(filtered);
        }

        function clearFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDateInput').value = '';
            renderCompetitions(allCompetitions);
        }

        function getBadgeStatus(dateStr, endDateStr) {
            if (!dateStr) return '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const [sYear, sMonth, sDay] = dateStr.split('-').map(Number);
            const start = new Date(sYear, sMonth - 1, sDay);

            let end = start;
            if (endDateStr) {
                const [eYear, eMonth, eDay] = endDateStr.split('-').map(Number);
                end = new Date(eYear, eMonth - 1, eDay);
            }

            const diffTime = start - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                return `<span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full font-medium">⏳ 倒數 ${diffDays} 天</span>`;
            } else if (today >= start && today <= end) {
                return `<span class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-medium">🔥 進行中</span>`;
            } else {
                return `<span class="bg-slate-100 text-slate-500 text-xs px-2 py-0.5 rounded-full">已結束</span>`;
            }
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            if (typeof str !== 'string') str = String(str);
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比賽管理系統 v2.4.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    🏆 比賽管理系統
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">發佈與管理各類賽事資訊 (v2.4.1)</p>
            </div>

            <!-- 頂部導覽列右側選單區塊 -->
            <div class="flex items-center gap-3">
                <!-- 權限身份標籤 -->
                <span id="authStatus"
                    class="text-sm font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                    👤 普通訪客
                </span>

                <!-- 🍔 統一功能選單按鈕 -->
                <div id="mainNavMenu" class="relative">
                    <button onclick="toggleNavDropdown()"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-lg border border-slate-300 text-sm font-medium flex items-center gap-1.5 transition">
                        ☰ 選單
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>

                    <!-- 下拉選單浮窗 -->
                    <div id="navDropdown"
                        class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50">

                        <!-- 帳號資訊 (僅登入時顯示) -->
                        <div id="dropdownUserInfo" class="hidden px-4 py-2 border-b border-slate-100 bg-slate-50">
                            <p class="text-xs text-slate-400">目前登入帳號</p>
                            <p id="dropdownUsername" class="text-sm font-bold text-slate-700 truncate">-</p>
                        </div>

                        <!-- 所有人皆可用：Bug 回報 -->
                        <button onclick="openBugReportModal(); closeNavDropdown();"
                            class="w-full text-left px-4 py-2.5 text-sm text-amber-700 hover:bg-amber-50 flex items-center gap-2 transition font-medium">
                            🐞 回報問題
                        </button>

                        <!-- 超級管理員/Web Owner 專屬：操作日誌 -->
                        <button id="auditLogBtn" onclick="openAuditLogModal(); closeNavDropdown();"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
                            📜 操作日誌
                        </button>

                        <!-- 超級管理員/Web Owner 專屬：錯誤日誌 -->
                        <button id="btn-error-logs" onclick="openErrorLogsModal(); closeNavDropdown();"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition font-medium">
                            🚨 錯誤日誌
                        </button>

                        <!-- 超級管理員/Web Owner 專屬：帳號管理 -->
                        <button id="adminMgmtBtn" onclick="openAdminModal(); closeNavDropdown();"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
                            ⚙️ 帳號管理
                        </button>

                        <div id="menuDivider" class="hidden border-t border-slate-100 my-1"></div>

                        <!-- 登入後專屬：修改密碼 -->
                        <button id="changePwdBtn" onclick="openChangePasswordModal(); closeNavDropdown();"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
                            🔑 修改個人密碼
                        </button>

                        <!-- 未登入時顯示：登入按鈕 -->
                        <button id="authBtn" onclick="toggleAuth(); closeNavDropdown();"
                            class="w-full text-left px-4 py-2.5 text-sm text-blue-600 hover:bg-blue-50 flex items-center gap-2 transition font-medium">
                            🔑 登入系統 Login
                        </button>

                        <!-- 登入後顯示：登出按鈕 -->
                        <button id="logoutBtn" onclick="handleLogout(); closeNavDropdown();"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition font-medium">
                            🚪 登出系統
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. 表單區塊：新增/編輯比賽 (僅限管理員) -->
        <section id="createSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                ➕ 發佈新比賽
            </h2>
            <form id="competitionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽名稱 *</label>
                    <input type="text" id="name" required placeholder="例如：2026 全國羽球公開賽"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽地點 (選填)</label>
                    <input type="text" id="location" placeholder="例如：XX體育館"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 日期與 24 小時制時間選擇器 (強制下拉選單) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽開始日期 / 時間 (24小時制)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" id="date"
                                class="w-full md:col-span-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div class="md:col-span-2 flex items-center gap-1">
                                <select id="start_hour"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">時</option>
                                </select>
                                <span class="font-bold text-slate-400">:</span>
                                <select id="start_minute"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">分</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽結束日期 / 時間 (24小時制)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" id="end_date"
                                class="w-full md:col-span-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div class="md:col-span-2 flex items-center gap-1">
                                <select id="end_hour"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">時</option>
                                </select>
                                <span class="font-bold text-slate-400">:</span>
                                <select id="end_minute"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">分</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="is_registration_open"
                        class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <label for="is_registration_open" class="text-xs font-semibold text-slate-700 cursor-pointer">開放報名中
                        (勾選後顯示「報名中」標籤)</label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽簡介 / 備註 (選填)</label>
                    <textarea id="description" rows="3" placeholder="請輸入詳細說明或報名連結..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        發佈比賽
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()"
                        class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition">
                        取消編輯
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 比賽列表區塊 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📋 比賽列表
                </h2>

                <!-- 搜尋與篩選列 + 回收桶按鈕 -->
                <div class="flex flex-wrap items-center gap-2">
                    <input type="text" id="searchInput" oninput="filterCompetitions()" placeholder="🔍 搜尋比賽名稱、地點..."
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="date" id="filterDateInput" onchange="filterCompetitions()"
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="clearFilter()"
                        class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1 bg-slate-100 rounded border">清除篩選</button>

                    <!-- 資源回收桶按鈕 (管理員與超級管理員可見) -->
                    <button id="mainTrashBtn" onclick="openTrashModal()"
                        class="hidden text-xs bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1 shadow-sm">
                        🗑️ 資源回收桶
                    </button>
                </div>
            </div>

            <!-- 動態渲染卡片清單 -->
            <div id="competitionList" class="space-y-4">
                <p class="text-center text-slate-400 py-8">載入中...</p>
            </div>
        </section>

    </main>

    <!-- 彈出視窗：修改密碼 Modal -->
    <div id="changePasswordModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🔑 修改個人密碼
                </h3>
                <button onclick="closeChangePasswordModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form id="changePasswordForm" onsubmit="submitChangePassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">舊密碼 *</label>
                    <input type="password" id="oldPassword" required placeholder="請輸入目前的密碼"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">新密碼 * (僅限英文字母與數字)</label>
                    <input type="password" id="newPassword" required placeholder="至少 6 位英文或數字" pattern="[a-zA-Z0-9]+"
                        title="僅允許使用英文字母與數字"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">確認新密碼 *</label>
                    <input type="password" id="confirmNewPassword" required placeholder="再次輸入新密碼" pattern="[a-zA-Z0-9]+"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="bg-blue-50 border border-blue-200 text-blue-700 text-xs p-2.5 rounded-lg">
                    💡 提示：密碼不可含有空白字元或符號，僅支援 A-Z、a-z 及 0-9。
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeChangePasswordModal()"
                        class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit"
                        class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition">確定修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈出視窗：分享海報 Modal -->
    <div id="posterModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div
            class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] flex flex-col items-center overflow-y-auto">
            <div class="flex justify-between items-center w-full border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🖼️ 比賽宣傳海報
                </h3>
                <button onclick="closePosterModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div class="w-full flex justify-center bg-slate-100 p-3 rounded-xl border border-slate-200">
                <canvas id="posterCanvas" class="max-w-full rounded-lg shadow-md"></canvas>
            </div>

            <div class="flex flex-wrap justify-end gap-2 w-full pt-2 border-t">
                <button onclick="copyPosterImage()"
                    class="px-4 py-2 text-sm bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 rounded-lg font-medium transition flex items-center gap-1">
                    📋 複製海報圖片
                </button>
                <button onclick="downloadPosterImage()"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition flex items-center gap-1">
                    ⬇️ 下載海報 (PNG)
                </button>
                <button onclick="closePosterModal()"
                    class="px-4 py-2 text-sm bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗：手動回報 Bug Modal -->
    <div id="bugReportModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🐞 回報系統問題 (Bug Report)
                </h3>
                <button onclick="closeBugReportModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form id="bugReportForm" onsubmit="submitBugReport(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題類型 *</label>
                    <select id="bugType" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="user_reported_bug">🐛 介面/功能異常 (Bug)</option>
                        <option value="time_format_error">⏰ 時間格式問題</option>
                        <option value="ui_display_issue">🎨 版面顯示錯亂</option>
                        <option value="other">💬 其他建議或問題</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題詳細描述 *</label>
                    <textarea id="bugDescription" rows="4" required placeholder="請詳細說明你在什麼步驟遇到了問題、預期結果與實際發生的狀況..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題截圖 (選填，支援 PNG/JPG，上限 10MB)</label>
                    <input type="file" id="bugScreenshot" accept="image/*" onchange="previewScreenshot(event)"
                        class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="screenshotPreviewContainer" class="mt-2 hidden">
                        <img id="screenshotPreview" src="" alt="預覽圖"
                            class="max-h-40 rounded border border-slate-200 object-contain">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">聯絡方式 (選填，請標記類型如：電話號碼)</label>
                    <input type="text" id="reporterContact" placeholder="方便我們向你回報修復進度"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeBugReportModal()"
                        class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit"
                        class="px-4 py-2 text-sm bg-amber-600 text-white rounded-lg hover:bg-amber-700 font-medium transition">送出回報</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈出視窗 1：登入 Modal -->
    <div id="loginModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">登入Login</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">帳號</label>
                    <input type="text" id="loginUsername" placeholder="account"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                    <input type="password" id="loginPassword" placeholder="password"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeLoginModal()"
                    class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="performLogin()"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">登入</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 2：系統操作日誌 Modal (超級管理員專屬) -->
    <div id="auditLogModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📜 系統操作日誌 (Audit Logs)
                </h3>
                <button onclick="closeAuditLogModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="auditLogList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs"></div>
            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeAuditLogModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 3：系統錯誤日誌 Modal (超級管理員專屬) -->
    <div id="errorLogsModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-red-600 flex items-center gap-2">
                    🚨 系統異常錯誤日誌 (Error Logs)
                </h3>
                <button onclick="closeErrorLogsModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="errorLogList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs font-mono"></div>
            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeErrorLogsModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 4：帳號管理 Modal (超級管理員專屬) -->
    <div id="adminModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">⚙️ 管理員帳號維護</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <!-- 新增管理員 -->
            <form onsubmit="handleAddAdmin(event)" class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <h4 class="text-xs font-bold text-slate-700 uppercase">新增管理員帳號</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="newAdminUser" placeholder="帳號" required
                        class="px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <input type="password" id="newAdminPass" placeholder="密碼" required
                        class="px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="flex justify-between items-center pt-1">
                    <select id="newAdminRole"
                        class="px-2 py-1.5 border border-slate-300 rounded text-xs focus:outline-none">
                        <option value="admin">一般管理員 (admin)</option>
                        <option value="super_admin">超級管理員 (super_admin)</option>
                    </select>
                    <button type="submit"
                        class="bg-emerald-600 text-white text-xs font-medium px-3 py-1.5 rounded hover:bg-emerald-700 transition">新增帳號</button>
                </div>
            </form>

            <!-- 帳號清單 -->
            <div>
                <h4 class="text-xs font-bold text-slate-700 uppercase mb-2">現有帳號列表</h4>
                <div id="adminList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>

            <div class="flex justify-end pt-2 border-t">
                <button onclick="closeAdminModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 5：資源回收桶 Modal -->
    <div id="trashModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🗑️ 資源回收桶 (已刪除賽事)
                </h3>
                <button onclick="closeTrashModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div id="trashList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>

            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeTrashModal()"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let allCompetitions = [];
        let currentUser = null;
        let currentBase64Screenshot = '';
        let currentPosterItem = null;

        // 下拉選單開關邏輯
        function toggleNavDropdown() {
            const dropdown = document.getElementById('navDropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        }

        function closeNavDropdown() {
            const dropdown = document.getElementById('navDropdown');
            if (dropdown) dropdown.classList.add('hidden');
        }

        // 點擊選單外部自動關閉下拉視窗
        window.addEventListener('click', function (e) {
            const menu = document.getElementById('mainNavMenu');
            const dropdown = document.getElementById('navDropdown');
            if (menu && !menu.contains(e.target) && dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        });

        function openChangePasswordModal() {
            closeNavDropdown();
            const modal = document.getElementById('changePasswordModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeChangePasswordModal() {
            const modal = document.getElementById('changePasswordModal');
            if (modal) modal.classList.add('hidden');
            const form = document.getElementById('changePasswordForm');
            if (form) form.reset();
        }

        async function submitChangePassword(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            // 前端即時檢查
            if (newPassword !== confirmNewPassword) {
                alert('兩次輸入的新密碼不一致！');
                return;
            }

            const alphaNumericRegex = /^[a-zA-Z0-9]+$/;
            if (!alphaNumericRegex.test(newPassword)) {
                alert('新密碼格式錯誤：只能包含英文字母與數字！');
                return;
            }

            try {
                const res = await customFetch('/api/auth/change-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': currentUser?.username || currentUser?.id
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                if (!res.ok) {
                    let errMsg = '修改失敗';
                    try {
                        const errJson = await res.json();
                        errMsg = errJson.error || errJson.message || errMsg;
                    } catch (e) { }
                    throw new Error(errMsg);
                }

                const data = await res.json();
                alert('✅ ' + (data.message || '密碼修改成功'));
                closeChangePasswordModal();
            } catch (err) {
                alert('修改失敗：' + err.message);
            }
        }

        // 登出處理程序
        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('competition_user');
            closeNavDropdown();
            updateUIByRole();
        }

        // 1. 動態控制新增帳號時的角色下拉選單
        function renderRoleSelectOptions() {
            const selectEl = document.getElementById('newAdminRole');
            if (!selectEl) return;

            if (currentUser?.role === 'web_owner') {
                selectEl.innerHTML = `
                    <option value="admin">一般管理員 (admin)</option>
                    <option value="super_admin">超級管理員 (super_admin)</option>
                `;
            } else {
                // super_admin 只能新增普通 admin
                selectEl.innerHTML = `
                    <option value="admin">一般管理員 (admin)</option>
                `;
            }
        }

        // 2. 帳號清單渲染防呆邏輯
        function getRoleBadge(role) {
            if (role === 'web_owner') return '<span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold">🧑🏻‍💼 Web Owner</span>';
            if (role === 'super_admin') return '<span class="bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded font-medium">🧑‍💼 超級管理員</span>';
            return '<span class="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded">👤 一般管理員</span>';
        }

        // 判定是否可顯示「刪除」按鈕
        function canDeleteAdmin(targetAdmin) {
            if (!currentUser) return false;
            if (targetAdmin.username === currentUser.username) return false; // 排除自己
            if (targetAdmin.role === 'web_owner') return false; // Web Owner 不可被刪

            if (currentUser.role === 'web_owner') return true;
            if (currentUser.role === 'super_admin') {
                // super_admin 只能刪除普通 admin
                return targetAdmin.role === 'admin';
            }
            return false;
        }

        // Helper: 解析 User-Agent 顯示裝置標籤
        function parseUserAgentBadge(ua) {
            if (!ua) return '<span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded">💻 未知裝置</span>';
            if (ua.includes('iPhone')) return '<span class="bg-purple-100 text-purple-700 text-[10px] px-1.5 py-0.5 rounded font-medium">📱 iPhone</span>';
            if (ua.includes('iPad')) return '<span class="bg-indigo-100 text-indigo-700 text-[10px] px-1.5 py-0.5 rounded font-medium">📱 iPad</span>';
            if (ua.includes('Macintosh') || ua.includes('Mac OS')) return '<span class="bg-slate-200 text-slate-700 text-[10px] px-1.5 py-0.5 rounded font-medium">💻 macOS</span>';
            if (ua.includes('Windows')) return '<span class="bg-blue-100 text-blue-700 text-[10px] px-1.5 py-0.5 rounded font-medium">💻 Windows</span>';
            if (ua.includes('Android')) return '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.5 rounded font-medium">🤖 Android</span>';
            return '<span class="bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded">🌐 Browser</span>';
        }

        // 初始化 24 小時制時間下拉選單 (00-23 時與 00-59 分)
        function initTimeSelects() {
            const hourOptions = '<option value="">時</option>' + Array.from({ length: 24 }, (_, i) => {
                const val = String(i).padStart(2, '0');
                return `<option value="${val}">${val} 時</option>`;
            }).join('');

            const minuteOptions = '<option value="">分</option>' + Array.from({ length: 60 }, (_, i) => {
                const val = String(i).padStart(2, '0');
                return `<option value="${val}">${val} 分</option>`;
            }).join('');

            document.getElementById('start_hour').innerHTML = hourOptions;
            document.getElementById('end_hour').innerHTML = hourOptions;
            document.getElementById('start_minute').innerHTML = minuteOptions;
            document.getElementById('end_minute').innerHTML = minuteOptions;
        }

        // 從下拉選單組合時間字串 (HH:mm)
        function getSelectedTime(hourId, minuteId) {
            const h = document.getElementById(hourId).value;
            const m = document.getElementById(minuteId).value;
            if (!h && !m) return '';
            return `${h || '00'}:${m || '00'}`;
        }

        // 設定下拉選單的值
        function setSelectedTime(timeStr, hourId, minuteId) {
            if (!timeStr) {
                document.getElementById(hourId).value = '';
                document.getElementById(minuteId).value = '';
                return;
            }
            const parts = timeStr.split(':');
            if (parts.length >= 2) {
                document.getElementById(hourId).value = parts[0].padStart(2, '0');
                document.getElementById(minuteId).value = parts[1].padStart(2, '0');
            }
        }

        // 格式化時間為 24 小時制 (HH:mm) 供清單渲染使用
        function format24HourTime(timeStr) {
            if (!timeStr) return '';
            const parts = timeStr.split(':');
            if (parts.length < 2) return timeStr;
            const hours = parts[0].padStart(2, '0');
            const minutes = parts[1].padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // 計算動態狀態標籤 (倒數天數 / 進行中 / 已結束)
        function getBadgeStatus(dateStr, endDateStr) {
            if (!dateStr) return '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const [startYear, startMonth, startDay] = dateStr.split('-').map(Number);
            const start = new Date(startYear, startMonth - 1, startDay);

            let end = start;
            if (endDateStr) {
                const [endYear, endMonth, endDay] = endDateStr.split('-').map(Number);
                end = new Date(endYear, endMonth - 1, endDay);
            }

            const diffTime = start - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                return `<span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full font-medium">⏳ 倒數 ${diffDays} 天</span>`;
            } else if (today >= start && today <= end) {
                return '<span class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-medium">🔥 進行中</span>';
            }
            return '<span class="bg-slate-100 text-slate-500 text-xs px-2 py-0.5 rounded-full">已結束</span>';
        }

        // HTML 轉義 Helper
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 保留雙引號的 HTML 轉義 (專用於操作日誌詳情 JSON 顯示)
        function escapeHtmlPreserveQuotes(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // ==========================================
        // 分享海報 Canvas 繪製機制邏輯
        // ==========================================
        function openPosterModal(id) {
            const item = allCompetitions.find(c => c.id === id);
            if (!item) return;
            currentPosterItem = item;

            document.getElementById('posterModal').classList.remove('hidden');
            renderPosterCanvas(item);
        }

        function closePosterModal() {
            document.getElementById('posterModal').classList.add('hidden');
            currentPosterItem = null;
        }

        function renderPosterCanvas(item) {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');

            const width = 600;
            const height = 800;
            canvas.width = width;
            canvas.height = height;

            // 背景漸層
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, '#0f172a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 頂部邊框金條裝飾
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(0, 0, width, 12);

            // Icon & 系統標題
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('🏆 比賽管理系統 官方宣傳海報', 40, 50);

            // 報名狀態標籤
            const statusText = item.is_registration_open ? '🔥 開放報名中' : '已截止';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillStyle = item.is_registration_open ? '#ef4444' : '#64748b';
            ctx.fillRect(40, 70, 100, 26);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(statusText, 50, 88);

            // 比賽主標題 (支援自動折行)
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            const nameLines = wrapCanvasText(ctx, item.name || '未命名比賽', width - 80);
            let startY = 140;
            nameLines.forEach(line => {
                ctx.fillText(line, 40, startY);
                startY += 38;
            });

            // 分割線
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(40, startY + 10);
            ctx.lineTo(width - 40, startY + 10);
            ctx.stroke();

            // 詳細資訊區塊
            let infoY = startY + 45;
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#cbd5e1';

            // 日期資訊
            let dateStr = item.date ? `${item.date} ${item.time ? format24HourTime(item.time) : ''}` : '未定';
            if (item.end_date) {
                dateStr += ` ~ ${item.end_date} ${item.end_time ? format24HourTime(item.end_time) : ''}`;
            }
            ctx.fillText(`📅 時間：${dateStr}`, 40, infoY);
            infoY += 32;

            // 地點資訊
            ctx.fillText(`📍 地點：${item.location || '未定'}`, 40, infoY);
            infoY += 40;

            // 簡介區塊底框
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#334155';
            const descHeight = height - infoY - 80;
            ctx.fillRect(40, infoY, width - 80, descHeight);
            ctx.strokeRect(40, infoY, width - 80, descHeight);

            // 簡介標題與內容
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText('📝 比賽簡介 / 備註：', 55, infoY + 30);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '14px sans-serif';
            const descText = item.description || '尚無詳細簡介內容。';
            const descLines = wrapCanvasText(ctx, descText, width - 110);
            let descY = infoY + 60;
            for (let i = 0; i < descLines.length && descY < infoY + descHeight - 20; i++) {
                ctx.fillText(descLines[i], 55, descY);
                descY += 24;
            }

            // 頁腳聲明
            ctx.fillStyle = '#64748b';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('掃描或關注系統以獲取最新賽事資訊', width / 2, height - 30);
            ctx.textAlign = 'left';
        }

        // Canvas 文字自動折行 Helper
        function wrapCanvasText(ctx, text, maxWidth) {
            const words = text.split('');
            const lines = [];
            let currentLine = '';

            for (let i = 0; i < words.length; i++) {
                const char = words[i];
                if (char === '\n') {
                    lines.push(currentLine);
                    currentLine = '';
                    continue;
                }
                const testLine = currentLine + char;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(currentLine);
                    currentLine = char;
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function downloadPosterImage() {
            const canvas = document.getElementById('posterCanvas');
            const link = document.createElement('a');
            const filename = currentPosterItem ? `${currentPosterItem.name}_海報.png` : 'competition_poster.png';
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function copyPosterImage() {
            const canvas = document.getElementById('posterCanvas');
            try {
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('❌ 生成圖片失敗');
                        return;
                    }
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        alert('✅ 海報圖片已成功複製到剪貼簿！');
                    } else {
                        alert('⚠️ 您的瀏覽器不支援直接複製圖片，請使用「下載海報」功能。');
                    }
                }, 'image/png');
            } catch (err) {
                console.error('複製海報失敗:', err);
                alert('❌ 複製失敗：' + err.message);
            }
        }

        // ==========================================
        // 手動 Bug 回報機制邏輯
        // ==========================================
        function openBugReportModal() {
            document.getElementById('bugReportModal').classList.remove('hidden');
        }

        function closeBugReportModal() {
            document.getElementById('bugReportModal').classList.add('hidden');
            document.getElementById('bugReportForm').reset();
            document.getElementById('screenshotPreviewContainer').classList.add('hidden');
            document.getElementById('screenshotPreview').src = '';
            currentBase64Screenshot = '';
        }

        function previewScreenshot(event) {
            const file = event.target.files[0];
            if (!file) {
                currentBase64Screenshot = '';
                document.getElementById('screenshotPreviewContainer').classList.add('hidden');
                document.getElementById('screenshotPreview').src = '';
                return;
            }

            if (!file.type.startsWith('image/')) {
                alert('請選擇有效的圖片檔案 (PNG, JPG 等)');
                event.target.value = '';
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('截圖檔案過大，請選擇 10MB 以下的圖片');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                currentBase64Screenshot = e.target.result;
                const img = document.getElementById('screenshotPreview');
                img.src = currentBase64Screenshot;
                document.getElementById('screenshotPreviewContainer').classList.remove('hidden');
            };
            reader.onerror = function () {
                alert('讀取圖片檔案失敗，請重新嘗試');
                event.target.value = '';
                currentBase64Screenshot = '';
                document.getElementById('screenshotPreviewContainer').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function submitBugReport(e) {
            e.preventDefault();
            const type = document.getElementById('bugType').value;
            const description = document.getElementById('bugDescription').value;
            const contact = document.getElementById('reporterContact').value;

            const payload = {
                error_type: type,
                message: description,
                stack_trace: `Contact: ${contact || 'None'}`,
                path: window.location.pathname + window.location.search,
                screenshot: currentBase64Screenshot
            };

            try {
                const res = await fetch('/api/logs/error', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': currentUser?.username || currentUser?.id || 'Guest'
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || errData.error || `HTTP ${res.status}`);
                }

                alert('✅ 感謝你的回報！問題已成功提交。');
                closeBugReportModal();
            } catch (err) {
                alert('回報提交失敗：' + err.message);
            }
        }

        // ==========================================
        // 1. 自動錯誤上報 Helper 函式
        // ==========================================
        async function reportErrorToBackend(errorData) {
            try {
                const userId = currentUser?.id || currentUser?.username || null;
                const headers = { 'Content-Type': 'application/json' };
                if (userId) headers['x-user-id'] = userId;

                await fetch('/api/logs/error', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        error_type: errorData.type || 'frontend_error',
                        message: errorData.message || 'Unknown Error',
                        stack_trace: errorData.stack || '',
                        path: window.location.pathname + window.location.search
                    })
                });
            } catch (err) {
                console.warn('[Error Reporter Failed]:', err);
            }
        }

        window.addEventListener('error', (event) => {
            if (event.target && (event.target.tagName === 'IMG' || event.target.tagName === 'SCRIPT')) return;
            reportErrorToBackend({
                type: 'frontend_js_error',
                message: event.message || 'Script Error',
                stack: event.error ? event.error.stack : `File: ${event.filename}:${event.lineno}:${event.colno}`
            });
        });

        window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            reportErrorToBackend({
                type: 'frontend_promise_rejection',
                message: reason instanceof Error ? reason.message : String(reason),
                stack: reason instanceof Error ? reason.stack : ''
            });
        });

        async function customFetch(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const clonedRes = response.clone();
                    let errorText = '';
                    try {
                        const errJson = await clonedRes.json();
                        errorText = errJson.message || errJson.error || response.statusText;
                    } catch (e) {
                        try {
                            errorText = await clonedRes.text();
                        } catch (tErr) {
                            errorText = response.statusText;
                        }
                    }
                    reportErrorToBackend({
                        type: 'api_failure',
                        message: `HTTP ${response.status} - ${errorText}`,
                        stack: `Endpoint: ${url} | Method: ${options.method || 'GET'}`
                    });
                }
                return response;
            } catch (networkError) {
                reportErrorToBackend({
                    type: 'network_failure',
                    message: networkError.message || 'Network Error',
                    stack: `Endpoint: ${url}`
                });
                throw networkError;
            }
        }

        function filterCompetitions() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterDate = document.getElementById('filterDateInput').value;

            const filtered = allCompetitions.filter(item => {
                const matchQuery = !query ||
                    (item.name && item.name.toLowerCase().includes(query)) ||
                    (item.location && item.location.toLowerCase().includes(query)) ||
                    (item.description && item.description.toLowerCase().includes(query));

                const matchDate = !filterDate || item.date === filterDate || item.end_date === filterDate;

                return matchQuery && matchDate;
            });

            renderCompetitions(filtered);
        }

            e.preventDefault();
            if (!currentUser) return alert('請先登入');

            const editingId = document.getElementById('editingId').value;
            const payload = {
                name: document.getElementById('name').value,
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                time: getSelectedTime('start_hour', 'start_minute'),
                end_date: document.getElementById('end_date').value,
                end_time: getSelectedTime('end_hour', 'end_minute'),

            };

            const url = editingId ? `/api/competitions/${editingId}` : '/api/competitions';
            const method = editingId ? 'PUT' : 'POST';

            try {
                const res = await customFetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': currentUser.username || currentUser.id
                    },
                    body: JSON.stringify(payload)
                });

                resetForm();
                fetchCompetitions();

            } catch (err) {
                alert('操作失敗：' + err.message);
            }

                .catch(err => {

                    try {
                        const errJson = await res.json();
                        errMsg = errJson.error || errJson.message || errMsg;
                    } catch (e) { }
                    throw new Error(errMsg);
                }

                const data = await res.json();
                alert('✅ 新增管理員成功！');
                document.getElementById('newAdminUser').value = '';
                document.getElementById('newAdminPass').value = '';
                fetchAdminList();
            } catch (err) {
                alert('新增失敗：' + err.message);
            }
        }

        async function deleteAdmin(username) {
            if (!confirm(`確定要刪除管理員帳號「${username}」嗎？`)) return;

            try {
                const res = await customFetch(`/api/admin/users/${encodeURIComponent(username)}`, {
                    method: 'DELETE',
                    headers: { 'x-user-id': currentUser.username || currentUser.id }
                });

                if (!res.ok) {
                    let errMsg = '刪除失敗';
                    try {
                        const errJson = await res.json();
                        errMsg = errJson.error || errJson.message || errMsg;
                    } catch (e) { }
                    throw new Error(errMsg);
                }

                const data = await res.json();
                alert('✅ 已成功刪除該帳號！');
                fetchAdminList();
            } catch (err) {
                alert('刪除失敗：' + err.message);
            }
        }

        // 資源回收桶 Modal
        async function openTrashModal() {
            document.getElementById('trashModal').classList.remove('hidden');
            fetchTrashList();
        }

        function closeTrashModal() {
            document.getElementById('trashModal').classList.add('hidden');
        }

        async function fetchTrashList() {
            const listEl = document.getElementById('trashList');
            listEl.innerHTML = '<p class="text-center text-slate-400 py-4">載入回收桶中...</p>';

            try {
                const res = await customFetch('/api/competitions/trash', {
                    headers: {
                        'x-user-id': currentUser.username || currentUser.id,
                        'x-user-role': currentUser.role || ''
                    }
                });

                if (!res.ok) {
                    let errMsg = '無法讀取回收桶資料';
                    try {
                        const errJson = await res.json();
                        errMsg = errJson.error || errJson.message || errMsg;
                    } catch (e) { }
                    throw new Error(errMsg);
                }

                const items = await res.json();

                if (!items || items.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-slate-400 py-8">回收桶目前是空的 🧹</p>';
                    return;
                }

                listEl.innerHTML = items.map(item => `
                    <div class="border border-slate-200 rounded-lg p-3.5 bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h4 class="text-sm font-bold text-slate-700">${escapeHtml(item.name)}</h4>
                            <p class="text-xs text-slate-400 mt-0.5">刪除時間：${new Date(item.deleted_at).toLocaleString()}</p>
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-center">
                            <button onclick="restoreCompetition(${item.id})" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-1 rounded transition font-medium">
                                ↺ 還原賽事
                            </button>
                            ${(currentUser?.role === 'web_owner' || currentUser?.role === 'super_admin') ? `
                                <button onclick="permanentlyDeleteCompetition(${item.id})" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1 rounded transition font-medium">
                                    ❌ 永久刪除
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<p class="text-red-500 text-center py-4">載入失敗：${escapeHtml(err.message)}</p>`;
            }
        }

        async function restoreCompetition(id) {
            try {
                const res = await customFetch(`/api/competitions/trash/${id}/restore`, {
                    method: 'POST',
                    headers: { 'x-user-id': currentUser.username || currentUser.id }
                });

                if (!res.ok) throw new Error('還原失敗');

                alert('✅ 賽事已成功還原！');
                fetchTrashList();
                fetchCompetitions();
            } catch (err) {
                alert(err.message);
            }
        }

        async function permanentlyDeleteCompetition(id) {
            if (!confirm('⚠️ 警告：確定要「永久刪除」此賽事嗎？此操作將無法復原！')) return;

            try {
                const res = await customFetch(`/api/competitions/trash/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-user-id': currentUser.username || currentUser.id }
                });

                if (!res.ok) throw new Error('永久刪除失敗');

                alert('✅ 賽事已永久刪除');
                fetchTrashList();
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比賽管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm border-b border-slate-200 mb-8">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">🏆 比賽管理系統</h1>
                <p class="text-sm text-slate-500">比賽資訊發佈與即時查詢</p>
            </div>
            <!-- 管理員權限按鈕 -->
            <div>
                <button id="adminLoginBtn" onclick="toggleAdminLogin()"
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium rounded-lg transition">
                    🔑 管理員登入
                </button>
                <button id="adminLogoutBtn" onclick="logoutAdmin()"
                    class="hidden px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium rounded-lg transition">
                    🚪 退出管理員
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 space-y-8">

        <!-- 發佈比賽表單（僅管理員可見） -->
        <section id="adminFormSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">➕ 發佈新比賽 (管理員專用)</h2>
            <form id="competitionForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">比賽名稱 <span
                            class="text-rose-500">*</span></label>
                    <input type="text" id="name" required placeholder="請輸入比賽名稱"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">比賽地點 (選填)</label>
                        <input type="text" id="location" placeholder="例如：體育館 A 場"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">比賽日期 (選填)</label>
                        <input type="date" id="date"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">比賽時間 (選填)</label>
                        <input type="text" id="time" placeholder="HH:mm (例 14:30)"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">詳細備註 (選填)</label>
                    <textarea id="description" rows="3" placeholder="補充比賽規則或說明..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">發佈比賽</button>
            </form>
        </section>

        <!-- 搜尋與篩選列 (所有人可用) -->
        <section
            class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="flex-1 w-full flex gap-3">
                <input type="text" id="searchInput" placeholder="🔍 搜尋比賽名稱、地點或備註..."
                    class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <input type="date" id="filterDate"
                    class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <button onclick="resetFilters()"
                class="w-full md:w-auto px-4 py-2 text-sm text-slate-600 hover:text-slate-900 border border-slate-300 rounded-lg hover:bg-slate-50 transition">清除篩選</button>
        </section>

        <!-- 比賽列表 -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">📋 比賽列表</h2>
                <span id="roleBadge"
                    class="text-xs px-2.5 py-1 bg-slate-200 text-slate-700 rounded-full font-medium">普通用戶模式 (唯讀)</span>
            </div>
            <div id="competitionsList" class="grid grid-cols-1 gap-4">
                <!-- 卡片動態渲染位置 -->
            </div>
        </section>

    </main>

    <script>
        let allCompetitions = [];

        // 初始化載入
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminStatus();
            fetchCompetitions();

            document.getElementById('searchInput').addEventListener('input', filterCompetitions);
            document.getElementById('filterDate').addEventListener('change', filterCompetitions);
            document.getElementById('competitionForm').addEventListener('submit', handleFormSubmit);
        });

        // 檢查管理員登入狀態
        function checkAdminStatus() {
            const adminPass = localStorage.getItem('adminPassword');
            const formSection = document.getElementById('adminFormSection');
            const loginBtn = document.getElementById('adminLoginBtn');
            const logoutBtn = document.getElementById('adminLogoutBtn');
            const roleBadge = document.getElementById('roleBadge');

            if (adminPass) {
                formSection.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                roleBadge.className = 'text-xs px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full font-medium';
                roleBadge.textContent = '👑 管理員模式';
            } else {
                formSection.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                roleBadge.className = 'text-xs px-2.5 py-1 bg-slate-200 text-slate-700 rounded-full font-medium';
                roleBadge.textContent = '普通用戶模式 (唯讀)';
            }
        }

        // 管理員登入
        async function toggleAdminLogin() {
            const password = prompt('請輸入管理員密碼：');
            if (!password) return;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('adminPassword', password);
                    alert('驗證成功！已進入管理員模式。');
                    checkAdminStatus();
                    renderCompetitions(allCompetitions); // 重新渲染以顯示刪除按鈕
                } else {
                    alert('密碼錯誤！');
                }
            } catch (err) {
                alert('驗證失敗，請檢查網路連線');
            }
        }

        // 管理員登出
        function logoutAdmin() {
            localStorage.removeItem('adminPassword');
            alert('已退出管理員模式');
            checkAdminStatus();
            renderCompetitions(allCompetitions);
        }

        // 取得所有比賽 (公開 GET)
        async function fetchCompetitions() {
            try {
                const res = await fetch('/api/competitions');
                allCompetitions = await res.json();
                renderCompetitions(allCompetitions);
            } catch (err) {
                console.error('載入失敗:', err);
            }
        }

        // 渲染比賽卡片
        function renderCompetitions(data) {
            const container = document.getElementById('competitionsList');
            const isAdmin = !!localStorage.getItem('adminPassword');

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-xl text-slate-400">目前沒有符合條件的比賽資訊。</div>`;
                return;
            }

            container.innerHTML = data.map(item => `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div class="space-y-1">
            <h3 class="text-lg font-bold text-slate-800">${escapeHtml(item.name)}</h3>
            <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-500">
              ${item.location ? `<span>📍 ${escapeHtml(item.location)}</span>` : ''}
              ${item.date ? `<span>📅 ${escapeHtml(item.date)}</span>` : ''}
              ${item.time ? `<span>⏰ ${escapeHtml(item.time)}</span>` : ''}
            </div>
            ${item.description ? `<p class="text-sm text-slate-600 mt-2 bg-slate-50 p-2 rounded">${escapeHtml(item.description)}</p>` : ''}
          </div>
          ${isAdmin ? `
            <button onclick="deleteCompetition(${item.id})" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-medium rounded-lg transition self-end md:self-auto">
              🗑️ 刪除
            </button>
          ` : ''}
        </div>
      `).join('');
        }

        // 新增比賽 (需要帶 Header)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const adminPassword = localStorage.getItem('adminPassword');
            if (!adminPassword) return alert('權限不足，請先登入管理員！');

            const payload = {
                name: document.getElementById('name').value,
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value
            };

            try {
                const res = await fetch('/api/competitions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': adminPassword
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error || '新增失敗');
                }

                document.getElementById('competitionForm').reset();
                fetchCompetitions();
                alert('成功發佈比賽！');
            } catch (err) {
                alert(err.message);
            }
        }

        // 刪除比賽 (需要帶 Header)
        async function deleteCompetition(id) {
            if (!confirm('確定要刪除此比賽資料嗎？')) return;
            const adminPassword = localStorage.getItem('adminPassword');

            try {
                const res = await fetch(`/api/competitions/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-password': adminPassword }
                });

                if (!res.ok) throw new Error('刪除失敗');
                fetchCompetitions();
            } catch (err) {
                alert('刪除失敗或權限不足！');
            }
        }

        // 篩選與重置
        function filterCompetitions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const date = document.getElementById('filterDate').value;

            const filtered = allCompetitions.filter(item => {
                const matchSearch = !search ||
                    item.name?.toLowerCase().includes(search) ||
                    item.location?.toLowerCase().includes(search) ||
                    item.description?.toLowerCase().includes(search);
                const matchDate = !date || item.date === date;
                return matchSearch && matchDate;
            });

            renderCompetitions(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDate').value = '';
            renderCompetitions(allCompetitions);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
        }
    </script>
</body>

</html>

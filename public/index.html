<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比賽管理系統 v2.4.4</title>
    <!-- Tailwind CSS 2.2.19 (本地靜態檔，符合 CSP style-src 'self') -->
    <link href="/css/tailwind.min.css" rel="stylesheet">
    <!-- 自訂補強樣式 (Modal 高度、滾動、背景模糊、色系補強、檔案按鈕) -->
    <link href="/css/custom.css" rel="stylesheet">
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    🏆 比賽管理系統
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">發佈與管理各類賽事資訊 (v2.4.4)</p>
            </div>

            <!-- 頂部導覽列右側選單區塊 -->
            <div class="flex items-center gap-3">
                <!-- 權限身份標籤 -->
                <span id="authStatus"
                    class="text-sm font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                    👤 普通訪客
                </span>

                <!-- 🍔 統一功能選單按鈕 -->
                <div id="mainNavMenu" class="relative">
                    <button id="navMenuBtn"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-lg border border-slate-300 text-sm font-medium flex items-center gap-1.5 transition">
                        ☰ 選單
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>

                    <!-- 下拉選單浮窗 -->
                    <div id="navDropdown"
                        class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50">

                        <!-- 帳號資訊 (僅登入時顯示) -->
                        <div id="dropdownUserInfo" class="hidden px-4 py-2 border-b border-slate-100 bg-slate-50">
                            <p class="text-xs text-slate-400">目前登入帳號</p>
                            <p id="dropdownUsername" class="text-sm font-bold text-slate-700 truncate">-</p>
                        </div>

                        <!-- 所有人皆可用：Bug 回報 -->
                        <button id="menuBugReport"
                            class="w-full text-left px-4 py-2.5 text-sm text-amber-700 hover:bg-amber-50 flex items-center gap-2 transition font-medium">
                            🐞 回報問題
                        </button>

                        <!-- 超級管理員/Web Owner 專屬：操作日誌 -->
                        <button id="auditLogBtn"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
                            📜 操作日誌
                        </button>

                        <!-- 超級管理員/Web Owner 專屬：錯誤日誌 -->
                        <button id="btn-error-logs"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition font-medium">
                            🚨 錯誤日誌
                        </button>

                        <!-- 超級管理員/Web Owner 專屬：帳號管理 -->
                        <button id="adminMgmtBtn"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
                            ⚙️ 帳號管理
                        </button>

                        <div id="menuDivider" class="hidden border-t border-slate-100 my-1"></div>

                        <!-- 登入後專屬：修改密碼 -->
                        <button id="changePwdBtn"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
                            🔑 修改個人密碼
                        </button>

                        <!-- 未登入時顯示：登入按鈕 -->
                        <button id="authBtn"
                            class="w-full text-left px-4 py-2.5 text-sm text-blue-600 hover:bg-blue-50 flex items-center gap-2 transition font-medium">
                            🔑 登入系統 Login
                        </button>

                        <!-- 登入後顯示：登出按鈕 -->
                        <button id="logoutBtn"
                            class="hidden w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition font-medium">
                            🚪 登出系統
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. 表單區塊：新增/編輯比賽 (僅限管理員) -->
        <section id="createSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                ➕ 發佈新比賽
            </h2>
            <form id="competitionForm" class="space-y-4">
                <input type="hidden" id="editingId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽名稱 *</label>
                    <input type="text" id="name" required placeholder="例如：2026 全國羽球公開賽"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽地點 (選填)</label>
                    <input type="text" id="location" placeholder="例如：XX體育館"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 日期與 24 小時制時間選擇器 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽開始日期 / 時間 (24小時制)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" id="date"
                                class="w-full md:col-span-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div class="md:col-span-2 flex items-center gap-1">
                                <select id="start_hour"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">時</option>
                                </select>
                                <span class="font-bold text-slate-400">:</span>
                                <select id="start_minute"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">分</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">比賽結束日期 / 時間 (24小時制)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" id="end_date"
                                class="w-full md:col-span-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div class="md:col-span-2 flex items-center gap-1">
                                <select id="end_hour"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">時</option>
                                </select>
                                <span class="font-bold text-slate-400">:</span>
                                <select id="end_minute"
                                    class="w-1/2 px-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">分</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="is_registration_open"
                        class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                    <label for="is_registration_open" class="text-xs font-semibold text-slate-700 cursor-pointer">開放報名中
                        (勾選後顯示「報名中」標籤)</label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">比賽簡介 / 備註 (選填)</label>
                    <textarea id="description" rows="3" placeholder="請輸入詳細說明或報名連結..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        發佈比賽
                    </button>
                    <button type="button" id="cancelEditBtn"
                        class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition">
                        取消編輯
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 比賽列表區塊 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📋 比賽列表
                </h2>

                <!-- 搜尋與篩選列 + 回收桶按鈕 -->
                <div class="flex flex-wrap items-center gap-2">
                    <input type="text" id="searchInput" placeholder="🔍 搜尋比賽名稱、地點..."
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="date" id="filterDateInput"
                        class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="clearFilterBtn"
                        class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1 bg-slate-100 rounded border">清除篩選</button>

                    <!-- 資源回收桶按鈕 (管理員與超級管理員可見) -->
                    <button id="mainTrashBtn"
                        class="hidden text-xs bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1 shadow-sm">
                        🗑️ 資源回收桶
                    </button>
                </div>
            </div>

            <!-- 動態渲染卡片清單 -->
            <div id="competitionList" class="space-y-4">
                <p class="text-center text-slate-400 py-8">載入中...</p>
            </div>
        </section>

    </main>

    <!-- 彈出視窗：修改密碼 Modal -->
    <div id="changePasswordModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🔑 修改個人密碼
                </h3>
                <button id="closeChangePwdModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form id="changePasswordForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">舊密碼 *</label>
                    <input type="password" id="oldPassword" required placeholder="請輸入目前的密碼"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">新密碼 * (僅限英文字母與數字)</label>
                    <input type="password" id="newPassword" required placeholder="至少 6 位英文或數字" pattern="[a-zA-Z0-9]+"
                        title="僅允許使用英文字母與數字"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">確認新密碼 *</label>
                    <input type="password" id="confirmNewPassword" required placeholder="再次輸入新密碼" pattern="[a-zA-Z0-9]+"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="bg-blue-50 border border-blue-200 text-blue-700 text-xs p-2.5 rounded-lg">
                    💡 提示：密碼不可含有空白字元或符號，僅支援 A-Z、a-z 及 0-9。
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" id="cancelChangePwdBtn"
                        class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit"
                        class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition">確定修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈出視窗：分享海報 Modal -->
    <div id="posterModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div
            class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-90vh modal-scroll flex flex-col items-center">
            <div class="flex justify-between items-center w-full border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🖼️ 比賽宣傳海報
                </h3>
                <button id="closePosterModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div class="w-full flex justify-center bg-slate-100 p-3 rounded-xl border border-slate-200">
                <canvas id="posterCanvas" class="max-w-full rounded-lg shadow-md"></canvas>
            </div>

            <div class="flex flex-wrap justify-end gap-2 w-full pt-2 border-t">
                <button id="copyPosterBtn"
                    class="px-4 py-2 text-sm bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 rounded-lg font-medium transition flex items-center gap-1">
                    📋 複製海報圖片
                </button>
                <button id="downloadPosterBtn"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition flex items-center gap-1">
                    ⬇️ 下載海報 (PNG)
                </button>
                <button id="closePosterBtn2"
                    class="px-4 py-2 text-sm bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗：手動回報 Bug Modal -->
    <div id="bugReportModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-90vh modal-scroll">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🐞 回報系統問題 (Bug Report)
                </h3>
                <button id="closeBugModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form id="bugReportForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題類型 *</label>
                    <select id="bugType" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="user_reported_bug">🐛 介面/功能異常 (Bug)</option>
                        <option value="time_format_error">⏰ 時間格式問題</option>
                        <option value="ui_display_issue">🎨 版面顯示錯亂</option>
                        <option value="other">💬 其他建議或問題</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題詳細描述 *</label>
                    <textarea id="bugDescription" rows="4" required placeholder="請詳細說明你在什麼步驟遇到了問題、預期結果與實際發生的狀況..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">問題截圖 (選填，支援 PNG/JPG，上限 10MB)</label>
                    <input type="file" id="bugScreenshot" accept="image/*" class="w-full text-xs text-slate-500">
                    <div id="screenshotPreviewContainer" class="mt-2 hidden">
                        <img id="screenshotPreview" src="" alt="預覽圖"
                            class="max-h-40 rounded border border-slate-200 object-contain">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">聯絡方式 (選填，請標記類型如：電話號碼)</label>
                    <input type="text" id="reporterContact" placeholder="方便我們向你回報修復進度"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" id="cancelBugBtn"
                        class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit"
                        class="px-4 py-2 text-sm bg-amber-600 text-white rounded-lg hover:bg-amber-700 font-medium transition">送出回報</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈出視窗 1：登入 Modal -->
    <div id="loginModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">登入 Login</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">帳號</label>
                    <input type="text" id="loginUsername" placeholder="account"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                    <input type="password" id="loginPassword" placeholder="password"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="cancelLoginBtn"
                    class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button id="submitLoginBtn"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">登入</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 2：系統操作日誌 Modal (超級管理員專屬) -->
    <div id="auditLogModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full p-6 space-y-4 max-h-85vh flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📜 系統操作日誌 (Audit Logs)
                </h3>
                <button id="closeAuditModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="auditLogList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs"></div>
            <div class="flex justify-end pt-3 border-t">
                <button id="closeAuditModalBtn2"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 3：系統錯誤日誌 Modal (超級管理員專屬) -->
    <div id="errorLogsModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full p-6 space-y-4 max-h-85vh flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-red-600 flex items-center gap-2">
                    🚨 系統異常錯誤日誌 (Error Logs)
                </h3>
                <button id="closeErrorModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="errorLogList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs font-mono"></div>
            <div class="flex justify-end pt-3 border-t">
                <button id="closeErrorModalBtn2"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 4：帳號管理 Modal (超級管理員專屬) -->
    <div id="adminModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-6 max-h-90vh modal-scroll">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">⚙️ 管理員帳號維護</h3>
                <button id="closeAdminModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <!-- 新增管理員 -->
            <form id="addAdminForm" class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <h4 class="text-xs font-bold text-slate-700 uppercase">新增管理員帳號</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="newAdminUser" placeholder="帳號" required
                        class="px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <input type="password" id="newAdminPass" placeholder="密碼" required
                        class="px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="flex justify-between items-center pt-1">
                    <select id="newAdminRole"
                        class="px-2 py-1.5 border border-slate-300 rounded text-xs focus:outline-none">
                        <option value="admin">一般管理員 (admin)</option>
                        <option value="super_admin">超級管理員 (super_admin)</option>
                    </select>
                    <button type="submit"
                        class="bg-emerald-600 text-white text-xs font-medium px-3 py-1.5 rounded hover:bg-emerald-700 transition">新增帳號</button>
                </div>
            </form>

            <!-- 帳號清單 -->
            <div>
                <h4 class="text-xs font-bold text-slate-700 uppercase mb-2">現有帳號列表</h4>
                <div id="adminList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>

            <div class="flex justify-end pt-2 border-t">
                <button id="closeAdminModalBtn2"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 5：資源回收桶 Modal -->
    <div id="trashModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-85vh flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    🗑️ 資源回收桶 (已刪除賽事)
                </h3>
                <button id="closeTrashModalBtn" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div id="trashList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>

            <div class="flex justify-end pt-3 border-t">
                <button id="closeTrashModalBtn2"
                    class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 引入外置主邏輯 -->
    <script src="/js/app.js"></script>
</body>

</html>
